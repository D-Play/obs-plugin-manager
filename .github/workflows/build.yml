name: Build and Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Qt 6
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.6.3'
        arch: 'win64_msvc2019_64'
        cache: true

    - name: Set up MSVC environment
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake
      run: |
        cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"

    - name: Build Plugin
      run: |
        cmake --build build --config Release

    - name: Package Plugin ZIP
      shell: pwsh
      run: |
        $pkgDir = "package/obs-plugin-manager"
        New-Item -ItemType Directory -Path "$pkgDir/bin/64bit" -Force
        Copy-Item "build/Release/obs-plugin-manager.dll" -Destination "$pkgDir/bin/64bit/"
        Copy-Item "README.md" -Destination "$pkgDir/" -ErrorAction SilentlyContinue
        Copy-Item "LICENSE" -Destination "$pkgDir/" -ErrorAction SilentlyContinue
        Compress-Archive -Path "package/*" -DestinationPath "obs-plugin-manager-windows-x64.zip"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: obs-plugin-manager-windows-x64
        path: obs-plugin-manager-windows-x64.zip

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: obs-plugin-manager-windows-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
